# Ücretsiz demo ortamı: yalnız API. Frontend Vercel'de, veritabanı Neon'da çalışır.
# Ücretsiz planda disk geçicidir, ClamAV ve worker yoktur; gerçek GMP verisi için kullanılmaz.
services:
  - type: web
    name: qms-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: AllowedHosts
        value: "*.onrender.com"
      - key: ConnectionStrings__QmsDatabase
        sync: false
      - key: RecordIntegrity__HmacKey
        sync: false
      - key: FileStorage__RootPath
        value: /data/qms-files
      - key: FileStorage__MinimumRetentionYears
        value: "10"
      - key: FileStorage__MalwareScanning__Required
        value: "false"
